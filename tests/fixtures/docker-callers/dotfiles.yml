# dotfiles' integration job: build the test image, then run the suite in it.
on:
  pull_request:
jobs:
  integration:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: image
        uses: mlorentedev/ci-workflows/.github/actions/docker-build@2b4a6b56701e533ebb6fbf53656ee136a8a5a6fd
        with:
          image: dotfiles-integration
          file: tests/integration/Dockerfile
          load: "true"
      - run: docker run --rm dotfiles-integration make test-integration
