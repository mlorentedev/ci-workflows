# Release, then publish in the same workflow, gated on release_created.
name: release-please

on:
  push:
    branches: [master]

permissions: {}

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release:
    uses: mlorentedev/ci-workflows/.github/workflows/release.yml@0000000000000000000000000000000000000000 # v0.3.0
    with:
      config_file: release-please-config.json
    secrets:
      RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}

  goreleaser:
    needs: release
    if: needs.release.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release.outputs.tag_name }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.26"
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7
        with:
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
