# The shape tests/pr-agent-shape.bats requires. Stands in for
# .github/workflows/pr-agent.yml until that file exists.
name: pr-agent

on:
  workflow_call:
    inputs:
      dotf_version:
        type: string
        required: true
    secrets:
      NAN_API_KEY:
        required: true
      PR_AGENT_ANTHROPIC_API_KEY:
        required: false

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: Install dotf
        run: |
          grep "linux_amd64" checksums.txt | sha256sum -c -
