name: lint

# Lints every workflow in this repository with actionlint, which also runs
# shellcheck over each `run:` block. The job id `lint` is the status check that
# branch protection requires today (dotfiles forge/branch-protection.json), so
# renaming it leaves `main` waiting on a context nothing reports. Once `gate`
# has reported on main, protection moves to `gate` alone (ADR-001 decision 3).

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Superseded PR runs are cancelled; pushes to main always finish, so every
# commit on main carries a result.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Which areas a pull request touched (ADR-001 decision 4). A docs-only pull
  # request skips lint and test; a push to main runs both. The blocks are
  # pinned to a release rather than run from this checkout, so a pull request
  # cannot weaken the gate that judges it.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      areas: ${{ steps.changes.outputs.areas }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: changes
        uses: mlorentedev/ci-workflows/.github/actions/changes@8bef3a8be673bf1bb297a3cac5f8aecf84804584 # v0.3.0
        with:
          filters: |
            code:
              - ".github/**"
              - "tests/**"
              - "renovate/**"
              - "renovate.json"
            toolchains:
              - ".github/actions/setup-*/**"
              - "tests/fixtures/toolchains/**"
            hygiene:
              - ".github/actions/hygiene/**"
              - "tests/fixtures/lessons/**"
              - "docs/lessons/**"

  lint:
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.areas), 'code')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      ACTIONLINT_VERSION: 1.7.12
      ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The release binary, verified against a pinned checksum: the same integrity
      # a SHA pin gives an action, without a Go toolchain on the runner.
      - name: Install actionlint
        run: |
          tarball="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSLo "${tarball}" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${tarball}"
          echo "${ACTIONLINT_SHA256}  ${tarball}" | sha256sum -c -
          tar -xzf "${tarball}" actionlint
      # ubuntu-latest ships shellcheck; with no arguments actionlint lints every
      # file under .github/workflows/.
      - name: Lint workflows and their shell (actionlint + shellcheck)
        run: ./actionlint -color -shellcheck=shellcheck

  test:
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.areas), 'code')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      BATS_VERSION: 1.13.0
      BATS_SHA256: a85e12b8828271a152b338ca8109aa23493b57950987c8e6dff97ba492772ff3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install bats
        run: |
          tarball="bats-${BATS_VERSION}.tar.gz"
          curl -fsSLo "${tarball}" \
            "https://github.com/bats-core/bats-core/archive/refs/tags/v${BATS_VERSION}.tar.gz"
          echo "${BATS_SHA256}  ${tarball}" | sha256sum -c -
          tar -xzf "${tarball}"
      # ubuntu-latest ships yq, which the tests read the workflows with.
      - name: Run the workflow shape tests
        run: '"./bats-core-${BATS_VERSION}/bin/bats" tests/'

  # The fleet preset and this repository's config, checked by the validator of
  # the engine the run uses (renovate/engine.json), as repository config and
  # strictly, so a deprecated option fails here before it reaches the fleet.
  renovate-config:
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.areas), 'code')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate the Renovate configs
        run: |
          engine="$(jq -er '.image + ":" + .version' renovate/engine.json)"
          docker run --rm -v "${PWD}:/repo:ro" -w /repo --entrypoint renovate-config-validator \
            "${engine}" --strict --no-global renovate.json renovate/default.json
      # Dependabot's directory "/" never reads .github/actions/*, so a pin inside
      # a composite went unbumped (#37). Extract with the preset alone, on a copy
      # without renovate.json (the local platform cannot fetch local> presets),
      # and fail when a workflow or a composite that pins an action by reference
      # yields no extracted dependency. Files with only local `./` uses pin nothing.
      - name: Check the preset reads every pinned workflow and composite
        run: |
          engine="$(jq -er '.image + ":" + .version' renovate/engine.json)"
          work="$(mktemp -d)"
          mkdir "${work}/repo"
          cp -R .github "${work}/repo/"
          cp renovate/default.json "${work}/preset.json"
          chmod -R a+rwX "${work}"
          docker run --rm -v "${work}:/w" -w /w/repo \
            -e LOG_LEVEL=debug -e LOG_FORMAT=json -e RENOVATE_PLATFORM=local \
            -e RENOVATE_DRY_RUN=extract -e RENOVATE_REQUIRE_CONFIG=ignored \
            -e RENOVATE_CONFIG_FILE=/w/preset.json "${engine}" > "${work}/extract.log" 2>&1
          grep -F '"msg":"Extracted dependencies"' "${work}/extract.log" | grep -oE '"packageFile":"[^"]*"' | cut -d'"' -f4 | sort -u > "${work}/found"
          missing=0
          checked=0
          for f in .github/workflows/*.yml .github/actions/*/action.yml; do
            grep -qE '^[[:space:]-]*uses:[[:space:]]*[^.[:space:]]' "${f}" || continue
            checked=$((checked + 1))
            grep -qxF "${f}" "${work}/found" || { echo "::error::Renovate does not read ${f}"; missing=1; }
          done
          # A broken pattern above would check nothing and pass.
          [ "${checked}" -ge 3 ] || { echo "::error::only ${checked} pinned files found"; exit 1; }
          echo "${checked} pinned files checked"
          exit "${missing}"

  # The toolchain composites run from this checkout against a fixture, so a
  # pull request proves the composite it changes (spec CI-004). A push to main
  # saves the cache and the next run restores it; the cache-hit line in the log
  # is the evidence verification.md cites.
  smoke-setup-node:
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.areas), 'toolchains')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: node
        uses: ./.github/actions/setup-node
        with:
          working-directory: tests/fixtures/toolchains/node
      - name: Install the fixture
        working-directory: tests/fixtures/toolchains/node
        run: npm ci --ignore-scripts --no-audit --no-fund
      # A key without the platform and the arch would let one runner restore
      # another's binaries (CI-004 AC5).
      - name: Report the cache
        env:
          HIT: ${{ steps.node.outputs.cache-hit }}
          KEY: ${{ steps.node.outputs.cache-primary-key }}
        run: |
          echo "cache-hit=${HIT}"
          echo "cache-primary-key=${KEY}"
          case "${KEY,,}" in
            "node-cache-${RUNNER_OS,,}-${RUNNER_ARCH,,}-npm-"*) ;;
            *) echo "::error::the npm cache key '${KEY}' does not start with node-cache-${RUNNER_OS}-${RUNNER_ARCH}-npm-: either it lost the platform, or actions/setup-node changed its key format"; exit 1 ;;
          esac

  # The hygiene composite with the real dotf (spec CI-005): this repository's
  # lessons pass, and a fixture with a lesson number used twice fails, naming it.
  smoke-hygiene:
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.areas), 'hygiene')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/hygiene
      - id: duplicate
        continue-on-error: true
        uses: ./.github/actions/hygiene
        with:
          lessons-dir: tests/fixtures/lessons/duplicate-number
      - name: The duplicate number fails and is named
        env:
          OUTCOME: ${{ steps.duplicate.outcome }}
        run: |
          if [ "${OUTCOME}" != "failure" ]; then
            echo "::error::the duplicate-number fixture passed the lessons check (outcome ${OUTCOME})"
            exit 1
          fi
          # The composite's own report: a run that failed in its install never
          # wrote the fixture's, and the first run's report names no fixture.
          report="${RUNNER_TEMP}/hygiene-lessons.txt"
          cat "${report}"
          grep -q "lesson-001-same-number.md" "${report}" || {
            echo "::error::the lessons check did not report the fixture's duplicate number"
            exit 1
          }

  smoke-setup-python-poetry:
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.areas), 'toolchains')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: poetry
        uses: ./.github/actions/setup-python-poetry
        with:
          poetry-version: "2.5.1"
          working-directory: tests/fixtures/toolchains/poetry
      # `check --lock` fails when the fixture's lock no longer matches its
      # pyproject.toml, which a restored venv would otherwise hide.
      - name: Install the fixture
        working-directory: tests/fixtures/toolchains/poetry
        run: |
          poetry check --lock
          poetry install --no-interaction
          test -x .venv/bin/python
          .venv/bin/python -c 'import six'
      - name: Report the cache
        env:
          HIT: ${{ steps.poetry.outputs.cache-hit }}
          KEY: ${{ steps.poetry.outputs.cache-primary-key }}
          POETRY_HIT: ${{ steps.poetry.outputs.poetry-cache-hit }}
        run: |
          echo "cache-hit=${HIT}"
          echo "cache-primary-key=${KEY}"
          echo "poetry-cache-hit=${POETRY_HIT}"

  # The one check branch protection will require (ADR-001 decision 3), once it
  # has reported on main. `if: always()` keeps a failed need from skipping it.
  gate:
    needs: [changes, lint, test, renovate-config, smoke-setup-node, smoke-hygiene, smoke-setup-python-poetry]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    steps:
      - uses: mlorentedev/ci-workflows/.github/actions/gate@8bef3a8be673bf1bb297a3cac5f8aecf84804584 # v0.3.0
        with:
          needs: ${{ toJSON(needs) }}
