name: lint

# Lints every workflow in this repository with actionlint, which also runs
# shellcheck over each `run:` block. The job id `lint` is the status check that
# branch protection requires today (dotfiles forge/branch-protection.json), so
# renaming it leaves `main` waiting on a context nothing reports. Once `gate`
# has reported on main, protection moves to `gate` alone (ADR-001 decision 3).

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Superseded PR runs are cancelled; pushes to main always finish, so every
# commit on main carries a result.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Which areas a pull request touched (ADR-001 decision 4). A docs-only pull
  # request skips lint and test; a push to main runs both. The blocks are
  # pinned to a release rather than run from this checkout, so a pull request
  # cannot weaken the gate that judges it.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      areas: ${{ steps.changes.outputs.areas }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: changes
        uses: mlorentedev/ci-workflows/.github/actions/changes@8bef3a8be673bf1bb297a3cac5f8aecf84804584 # v0.3.0
        with:
          filters: |
            code:
              - ".github/**"
              - "tests/**"
              - "renovate/**"
              - "renovate.json"
              # tests/specs.bats parses every feature list (#46).
              - "specs/**/features.json"
            toolchains:
              - ".github/actions/setup-*/**"
              - "tests/fixtures/toolchains/**"
            hygiene:
              - ".github/actions/hygiene/**"
              - "tests/fixtures/lessons/**"
              - "docs/lessons/**"
            docker:
              - ".github/actions/docker-build/**"
              - "tests/fixtures/docker-build/**"

  lint:
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.areas), 'code')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      ACTIONLINT_VERSION: 1.7.12
      ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The release binary, verified against a pinned checksum: the same integrity
      # a SHA pin gives an action, without a Go toolchain on the runner.
      - name: Install actionlint
        run: |
          tarball="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSLo "${tarball}" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${tarball}"
          echo "${ACTIONLINT_SHA256}  ${tarball}" | sha256sum -c -
          tar -xzf "${tarball}" actionlint
      # ubuntu-latest ships shellcheck; with no arguments actionlint lints every
      # file under .github/workflows/.
      - name: Lint workflows and their shell (actionlint + shellcheck)
        run: ./actionlint -color -shellcheck=shellcheck

  test:
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.areas), 'code')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      BATS_VERSION: 1.13.0
      BATS_SHA256: a85e12b8828271a152b338ca8109aa23493b57950987c8e6dff97ba492772ff3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history and origin/main, so tests/docker-publish-shape.bats can
          # check that the composite pin is a commit on main.
          fetch-depth: 0
      - name: Install bats
        run: |
          tarball="bats-${BATS_VERSION}.tar.gz"
          curl -fsSLo "${tarball}" \
            "https://github.com/bats-core/bats-core/archive/refs/tags/v${BATS_VERSION}.tar.gz"
          echo "${BATS_SHA256}  ${tarball}" | sha256sum -c -
          tar -xzf "${tarball}"
      # ubuntu-latest ships yq, which the tests read the workflows with.
      - name: Run the workflow shape tests
        run: '"./bats-core-${BATS_VERSION}/bin/bats" tests/'

  # The fleet preset and this repository's config, checked by the validator of
  # the engine the run uses (renovate/engine.json), as repository config and
  # strictly, so a deprecated option fails here before it reaches the fleet.
  renovate-config:
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.areas), 'code')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate the Renovate configs
        run: |
          engine="$(jq -er '.image + ":" + .version' renovate/engine.json)"
          docker run --rm -v "${PWD}:/repo:ro" -w /repo --entrypoint renovate-config-validator \
            "${engine}" --strict --no-global renovate.json renovate/default.json
      # Dependabot's directory "/" never reads .github/actions/*, so a pin inside
      # a composite went unbumped (#37). Extract with the preset alone, on a copy
      # without renovate.json (the local platform cannot fetch local> presets),
      # and fail when a workflow or a composite that pins an action by reference
      # yields no extracted dependency. Files with only local `./` uses pin nothing.
      # renovate.yml relies on RENOVATE_EXIT_CODE_FOR_ERRORS to go red when a
      # repository aborts (#43). Run the pinned engine on a repository whose
      # config is broken: an engine bump that stops honouring it fails here.
      - name: Check the engine exits non-zero when a repository aborts
        run: |
          engine="$(jq -er '.image + ":" + .version' renovate/engine.json)"
          work="$(mktemp -d)"
          mkdir "${work}/repo"
          echo '{"extends": [' > "${work}/repo/renovate.json"
          chmod -R a+rwX "${work}"
          rc=0
          docker run --rm -v "${work}:/w" -w /w/repo -e LOG_LEVEL=info \
            -e RENOVATE_PLATFORM=local -e RENOVATE_DRY_RUN=extract \
            -e RENOVATE_EXIT_CODE_FOR_ERRORS=true "${engine}" > "${work}/run.log" 2>&1 || rc=$?
          if [ "${rc}" -eq 0 ]; then
            tail -20 "${work}/run.log"
            echo "::error::Renovate ${engine} exited 0 on a repository that ended in config-validation: RENOVATE_EXIT_CODE_FOR_ERRORS no longer turns an aborted repository into a failed run"
            exit 1
          fi
          echo "the engine exits ${rc} on an aborted repository"

      - name: Check the preset reads every pinned workflow and composite
        run: |
          engine="$(jq -er '.image + ":" + .version' renovate/engine.json)"
          work="$(mktemp -d)"
          mkdir "${work}/repo"
          cp -R .github "${work}/repo/"
          # The preset plus this repository's own managers (#53). The local
          # platform cannot resolve renovate.json's local> preset, so merge them.
          jq -s '.[0] * {customManagers: .[1].customManagers}' renovate/default.json renovate.json > "${work}/preset.json"
          chmod -R a+rwX "${work}"
          docker run --rm -v "${work}:/w" -w /w/repo \
            -e LOG_LEVEL=debug -e LOG_FORMAT=json -e RENOVATE_PLATFORM=local \
            -e RENOVATE_DRY_RUN=extract -e RENOVATE_REQUIRE_CONFIG=ignored \
            -e RENOVATE_CONFIG_FILE=/w/preset.json "${engine}" > "${work}/extract.log" 2>&1
          grep -F '"msg":"Extracted dependencies"' "${work}/extract.log" | grep -oE '"packageFile":"[^"]*"' | cut -d'"' -f4 | sort -u > "${work}/found"
          missing=0
          checked=0
          for f in .github/workflows/*.yml .github/actions/*/action.yml; do
            grep -qE '^[[:space:]-]*uses:[[:space:]]*[^.[:space:]]' "${f}" || continue
            checked=$((checked + 1))
            grep -qxF "${f}" "${work}/found" || { echo "::error::Renovate does not read ${f}"; missing=1; }
          done
          # A broken pattern above would check nothing and pass.
          [ "${checked}" -ge 3 ] || { echo "::error::only ${checked} pinned files found"; exit 1; }
          echo "${checked} pinned files checked"
          # Each dotf version default is one dependency, so one PR bumps them all (#53).
          for f in .github/workflows/pr-agent.yml .github/actions/hygiene/action.yml; do
            jq -rR --arg f "${f}" 'fromjson? | select(.msg == "Extracted dependencies")
              | .. | objects | select(.packageFile? == $f) | .deps[]?.depName' "${work}/extract.log" |
              grep -qx mlorentedev/dotfiles ||
              { echo "::error::Renovate does not read the dotf version default in ${f}"; missing=1; }
          done
          exit "${missing}"

  # The toolchain composites run from this checkout against a fixture, so a
  # pull request proves the composite it changes (spec CI-004). A push to main
  # saves the cache and the next run restores it; the cache-hit line in the log
  # is the evidence verification.md cites.
  smoke-setup-node:
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.areas), 'toolchains')
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: node
        uses: ./.github/actions/setup-node
        with:
          working-directory: tests/fixtures/toolchains/node
          playwright: "true"
      # Chromium only, and without --with-deps: the smoke proves the cached
      # browsers path, which macOS got wrong before #69, not a browser launch.
      - name: Install the fixture
        working-directory: tests/fixtures/toolchains/node
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npx playwright install chromium
          ls -d "${PLAYWRIGHT_BROWSERS_PATH}"/chromium-* || {
            echo "::error::no chromium-* under PLAYWRIGHT_BROWSERS_PATH=${PLAYWRIGHT_BROWSERS_PATH}, the path setup-node caches"
            exit 1
          }
      # A key without the platform and the arch would let one runner restore
      # another's binaries (CI-004 AC5). tr, not ${KEY,,}: macOS runs bash 3.2.
      - name: Report the cache
        env:
          HIT: ${{ steps.node.outputs.cache-hit }}
          KEY: ${{ steps.node.outputs.cache-primary-key }}
          PLAYWRIGHT_HIT: ${{ steps.node.outputs.playwright-cache-hit }}
        run: |
          echo "cache-hit=${HIT}"
          echo "cache-primary-key=${KEY}"
          echo "playwright-cache-hit=${PLAYWRIGHT_HIT}"
          lower() { printf '%s' "$1" | tr '[:upper:]' '[:lower:]'; }
          case "$(lower "${KEY}")" in
            "node-cache-$(lower "${RUNNER_OS}")-$(lower "${RUNNER_ARCH}")-npm-"*) ;;
            *) echo "::error::the npm cache key '${KEY}' does not start with node-cache-${RUNNER_OS}-${RUNNER_ARCH}-npm-: either it lost the platform, or actions/setup-node changed its key format"; exit 1 ;;
          esac

  # The hygiene composite with the real dotf (spec CI-005): this repository's
  # lessons pass, and a fixture with a lesson number used twice fails, naming it.
  smoke-hygiene:
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.areas), 'hygiene')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/hygiene
      - id: duplicate
        continue-on-error: true
        uses: ./.github/actions/hygiene
        with:
          lessons-dir: tests/fixtures/lessons/duplicate-number
      - name: The duplicate number fails and is named
        env:
          OUTCOME: ${{ steps.duplicate.outcome }}
        run: |
          if [ "${OUTCOME}" != "failure" ]; then
            echo "::error::the duplicate-number fixture passed the lessons check (outcome ${OUTCOME})"
            exit 1
          fi
          # The composite's own report: a run that failed in its install never
          # wrote the fixture's, and the first run's report names no fixture.
          report="${RUNNER_TEMP}/hygiene-lessons.txt"
          cat "${report}"
          grep -q "lesson-001-same-number.md" "${report}" || {
            echo "::error::the lessons check did not report the fixture's duplicate number"
            exit 1
          }

  # docker-build (CI-010 AC3). The cold job builds the fixture into a scope no
  # earlier run wrote, then the warm job, on a fresh runner and builder, rebuilds
  # it from that cache. The fixture's stamp layer proves the restore: a rebuilt
  # layer carries a new stamp.
  smoke-docker-build:
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.areas), 'docker')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      stamp: ${{ steps.stamp.outputs.stamp }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: build
        uses: ./.github/actions/docker-build
        with:
          image: ci-workflows-smoke
          context: tests/fixtures/docker-build
          load: "true"
          cache-scope: smoke-${{ github.run_id }}-${{ github.run_attempt }}
      - id: stamp
        run: echo "stamp=$(docker run --rm ci-workflows-smoke)" >>"${GITHUB_OUTPUT}"

  smoke-docker-build-warm:
    needs: [changes, smoke-docker-build]
    if: contains(fromJSON(needs.changes.outputs.areas), 'docker')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: start
        run: echo "at=$(date +%s)" >>"${GITHUB_OUTPUT}"
      - id: build
        uses: ./.github/actions/docker-build
        with:
          image: ci-workflows-smoke
          context: tests/fixtures/docker-build
          load: "true"
          cache-scope: smoke-${{ github.run_id }}-${{ github.run_attempt }}
      - name: The warm build is under 30 s and restored the cold build's layer
        env:
          STARTED: ${{ steps.start.outputs.at }}
          COLD_STAMP: ${{ needs.smoke-docker-build.outputs.stamp }}
        run: |
          took=$(( $(date +%s) - STARTED ))
          stamp=$(docker run --rm ci-workflows-smoke)
          echo "warm build: ${took} s; stamp ${stamp}, cold ${COLD_STAMP}"
          if [ -z "${COLD_STAMP}" ] || [ "${stamp}" != "${COLD_STAMP}" ]; then
            echo "::error::the warm build ran the stamp step again instead of restoring it from the cache"
            exit 1
          fi
          if [ "${took}" -gt 30 ]; then
            echo "::error::the warm build took ${took} s, over the 30 s objective"
            exit 1
          fi

  smoke-setup-python-poetry:
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.areas), 'toolchains')
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: poetry
        uses: ./.github/actions/setup-python-poetry
        with:
          poetry-version: "2.5.1"
          working-directory: tests/fixtures/toolchains/poetry
      # `check --lock` fails when the fixture's lock no longer matches its
      # pyproject.toml, which a restored venv would otherwise hide.
      - name: Install the fixture
        working-directory: tests/fixtures/toolchains/poetry
        run: |
          poetry check --lock
          poetry install --no-interaction
          test -x .venv/bin/python
          .venv/bin/python -c 'import six'
      - name: Report the cache
        env:
          HIT: ${{ steps.poetry.outputs.cache-hit }}
          KEY: ${{ steps.poetry.outputs.cache-primary-key }}
          POETRY_HIT: ${{ steps.poetry.outputs.poetry-cache-hit }}
        run: |
          echo "cache-hit=${HIT}"
          echo "cache-primary-key=${KEY}"
          echo "poetry-cache-hit=${POETRY_HIT}"

  smoke-setup-python-uv:
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.areas), 'toolchains')
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: uv
        uses: ./.github/actions/setup-python-uv
        with:
          working-directory: tests/fixtures/toolchains/uv
      # --locked fails when the fixture's lock no longer matches its
      # pyproject.toml, which a restored cache would otherwise hide.
      - name: Install the fixture
        working-directory: tests/fixtures/toolchains/uv
        run: |
          uv sync --locked
          uv run --locked python -c 'import six'
      # setup-uv builds its key from process.arch and process.platform, renamed
      # in its src/utils/platforms.ts (x64 is x86_64, linux is
      # unknown-linux-gnu). A key without them would let one runner restore
      # another's wheels (CI-004 AC5).
      - name: Report the cache
        env:
          HIT: ${{ steps.uv.outputs.cache-hit }}
          KEY: ${{ steps.uv.outputs.cache-primary-key }}
          PYTHON_HIT: ${{ steps.uv.outputs.python-cache-hit }}
        run: |
          echo "cache-hit=${HIT}"
          echo "cache-primary-key=${KEY}"
          echo "python-cache-hit=${PYTHON_HIT}"
          case "${RUNNER_ARCH}" in X64) arch=x86_64 ;; ARM64) arch=aarch64 ;; *) arch="${RUNNER_ARCH}" ;; esac
          case "${RUNNER_OS}" in Linux) platform=unknown-linux-gnu ;; macOS) platform=apple-darwin ;; *) platform="${RUNNER_OS}" ;; esac
          case "${KEY}" in
            "setup-uv-2-${arch}-${platform}-"*) ;;
            *) echo "::error::the uv cache key '${KEY}' does not start with setup-uv-2-${arch}-${platform}-: either it lost the platform, or astral-sh/setup-uv changed its key format"; exit 1 ;;
          esac

  smoke-setup-go-lint:
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.areas), 'toolchains')
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: go
        uses: ./.github/actions/setup-go-lint
        with:
          golangci-lint-version: v2.15.0
          working-directory: tests/fixtures/toolchains/go
      - name: Build and lint the fixture
        working-directory: tests/fixtures/toolchains/go
        run: |
          go build ./...
          golangci-lint run
      # setup-go publishes no key. Its key names RUNNER_OS and the arch
      # (src/cache-restore.ts at v7.0.0), and the warm run's log shows it.
      - name: Report the cache
        env:
          HIT: ${{ steps.go.outputs.cache-hit }}
          GO_VERSION: ${{ steps.go.outputs.go-version }}
          LINT_VERSION: ${{ steps.go.outputs.golangci-lint-version }}
        run: |
          echo "cache-hit=${HIT}"
          echo "go-version=${GO_VERSION}"
          echo "golangci-lint-version=${LINT_VERSION}"

  # The one check branch protection will require (ADR-001 decision 3), once it
  # has reported on main. `if: always()` keeps a failed need from skipping it.
  gate:
    needs: [changes, lint, test, renovate-config, smoke-setup-node, smoke-hygiene, smoke-docker-build, smoke-docker-build-warm, smoke-setup-python-poetry, smoke-setup-python-uv, smoke-setup-go-lint]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    steps:
      - uses: mlorentedev/ci-workflows/.github/actions/gate@8bef3a8be673bf1bb297a3cac5f8aecf84804584 # v0.3.0
        with:
          needs: ${{ toJSON(needs) }}
